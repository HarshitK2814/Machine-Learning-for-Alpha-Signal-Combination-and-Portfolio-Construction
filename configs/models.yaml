# Workstream B (Harshit): model cells and their hyperparameter grids.
# Every grid point that is fitted is logged to outputs/trials.csv (C13).

horizons: [1, 3, 6, 12]        # target horizon h; chosen on validation, counted as a trial

ridge:
  alpha_grid: [0.0001, 0.001, 0.01, 0.1, 1.0, 10.0, 100.0, 1000.0, 10000.0]

conditional_linear:
  alpha_grid: [0.01, 0.1, 1.0, 10.0, 100.0, 1000.0]
  interaction_states: [MKTVOL, BEAR, ILLIQ, SENT, CREDIT, TERM]

lightgbm:
  num_leaves: [15, 31]
  learning_rate: [0.01, 0.05]
  min_data_in_leaf: [500, 2000]
  feature_fraction: [0.5, 0.8]
  bagging_fraction: 0.8
  lambda_l2: [0.0, 10.0]
  num_boost_round: 2000
  early_stopping_rounds: 50

neural_net:
  layers: [32, 16, 8]
  l1: [0.00001, 0.0001]
  learning_rate: 0.001
  batch_size: 10000
  max_epochs: 60
  patience: 5
  ensemble_seeds: 5            # 10+ for the final run (E56); 5 keeps development fast

mixture_of_experts:
  experts: 3
  expert_layers: [16, 8]
  gate_inputs: states_only

economic_policy:
  hidden: [16, 8]
  bptt_months: 12
  learning_rate: 0.005
  max_epochs: 40
  patience: 5
  turnover_penalty_from_costs: true

uncertainty:
  members: 5
  kappa_grid: [0.0, 0.5, 1.0, 2.0, 4.0]
